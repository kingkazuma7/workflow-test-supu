name: Tests

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_USER: "postgres"

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pytest
      run: pytest tests/

    - name: Faiul if tests fail
      if: failure()
      run: echo "1つ前のステップが失敗しました。"

    - name: Print DB_USER
      run: echo "DB_USER -> ${DB_USER}"

    - name: Print Secret
      run: echo "SUPU_API_KEY -> ${secrets.SUPU_API_KEY}"